#ME/.config/alacritty/alacritty.toml
# by Rito Ghosh 2023-10-06

# Alacritty now uses TOML formatting for its config files.
# This is a simple example.

# There are the specification here: https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd
# It is not obvious how it translates to TOML. But it is extremely straightforward.

# example: WINDOW, COLORS, etc. are tables, and should be represented as [window], [colors], respectively.
# specifics of variables go under them. e.g.- look under "dynamic_padding" under-
# https://github.com/alacritty/alacritty/blob/master/extra/man/alacritty.5.scd#window
# write `dynamic_padding = true` (without backticks -`) under the table [window]
# for variables with multiple values, use "dotted keys". Like setting `padding.x = 5` under [window].
# This is simple. If not clear, do several trials and errors.

# Below is my initial set-up. The TOML homepage (https://toml.io/en/v1.0.0) was very helpful in figuring this out. 
# I put the file alacritty.toml in $HOME/.config/alacritty. However it can be kept anywhere among the places mentioned in
# https://github.com/alacritty/alacritty/tree/master#configuration

[window]

opacity = 0.9

padding.x = 10
padding.y = 10

decorations = "Full"
decorations_theme_variant = "Dark" # "Light"

[font]

# JetBrainsMono Nerd Font (installed in ~/.local/share/fonts).
# Previously "Consolas" — not installed on this Fedora box, so fontconfig
# silently fell back to Noto Sans Mono, which lacks powerline/nerd icons,
# check/cross marks, warning, etc. NFM (Mono) variant keeps ALL glyphs
# single-width, so icons don't break column alignment.
normal.family = "JetBrainsMono Nerd Font Mono"
bold.family = "JetBrainsMono Nerd Font Mono"
italic.family = "JetBrainsMono Nerd Font Mono"
bold_italic.family = "JetBrainsMono Nerd Font Mono"

size = 10.0

# Cyberpunk palette extracted from purple_cyberpunk_4k.jpg
[colors.primary]
background = "#0a0018"
foreground = "#f0e6f7"

[colors.cursor]
text = "#0a0018"
cursor = "#a020c0"

[colors.selection]
text = "#f0e6f7"
background = "#602080"

[colors.normal]
black   = "#0a0018"
red     = "#d040f0"
green   = "#a020c0"
yellow  = "#c040e0"
blue    = "#8020a0"
magenta = "#d040f0"
cyan    = "#9020b0"
white   = "#f0e6f7"

[colors.bright]
black   = "#200040"
red     = "#e060ff"
green   = "#c040e0"
yellow  = "#d060f0"
blue    = "#a020c0"
magenta = "#e060ff"
cyan    = "#b040d0"
white   = "#f0e6f7"

[colors.dim]
black   = "#050010"
red     = "#8020a0"
green   = "#602080"
yellow  = "#702090"
blue    = "#501870"
magenta = "#8020a0"
cyan    = "#602080"
white   = "#a080c0"

